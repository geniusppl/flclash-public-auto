name: update-flclash
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python build.py
      - name: commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add flclash.yaml nodes.txt sing-box.json
          git diff --cached --quiet || git commit -m "update flclash.yaml, nodes.txt and sing-box.json"
          git push
      - name: purge jsdelivr cache
        if: success()
        run: |
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/flclash.yaml" || true
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/nodes.txt" || true
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/sing-box.json" || true
